[package]
name = "rammblery"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
libc = "0.2"
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFNumber", "CFDictionary", "CFArray", "CFRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }
objc2-application-services = { version = "0.3", features = [
    "HIServices",
    "AXUIElement",
    "AXValue",
    "AXValueConstants",
    "AXError",
    "AXAttributeConstants",
    "AXNotificationConstants",
    "AXRoleConstants",
    "Accessibility",
    "libc",
] }

[[bin]]
name = "rammblery"
path = "src/main.rs"
